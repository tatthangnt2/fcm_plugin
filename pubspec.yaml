name: fcm_plugin
description: "A custom FCM plugin for AppRelease"
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  firebase_messaging: ^16.0.3

flutter:
  plugin:
    platforms:
      android:
        package: com.fcm.plugin
        pluginClass: FCMPlugin
